# https://taskfile.dev

version: "3"

vars:
  APP_FOLDER: "app"
  TEST_FOLDER: "tests"
  FEATURES_FOLDER: "features"
  PORT_LOCAL_SERVER: 8888
  CURRENT_E2E_TEST: "@CURRENT"

tasks:
  build:
    aliases:
      - default
    cmds:
      - task: rollup:build
      - task: minify-widget

  rollup:build:
    deps: [npm:install]
    sources:
      - "{{.APP_FOLDER}}/data/**/*.md"
      - "{{.APP_FOLDER}}/index.md"
      - "{{.APP_FOLDER}}/css/**/*.css"
      - "{{.APP_FOLDER}}/js/**/*.mjs"
      - "{{.APP_FOLDER}}/js/**/*.js"
      - "{{.APP_FOLDER}}/index.html"
      - "{{.APP_FOLDER}}/DEBUG" # On vérifie si ce fichier a changé (parce qu'on a lancé une nouvelle version pour le DEBUG), afin de pouvoir relancer le build pour la version PROD
      - rollup.config.mjs
    generates:
      - "{{.APP_FOLDER}}/css/styles.min.css"
      - "{{.APP_FOLDER}}/script.min.js"
      - "{{.APP_FOLDER}}/script.min.js.map"
    method: timestamp
    cmds:
      - cmd: npx rollup --config
      - cmd: | # On supprime le fichier DEBUG si on build en version PROD
          if [ -e "{{.APP_FOLDER}}/DEBUG" ]; then
            rm "{{.APP_FOLDER}}/DEBUG"
          fi
        silent: true

  npm:install:
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  debug:
    deps: [npm:install]
    sources:
    cmds:
      - cmd: npx rollup --config --environment DEBUG
      - cmd: touch "{{.APP_FOLDER}}/DEBUG" # On ajoute un fichier DEBUG pour indiquer qu'on n'est pas en mode prod (warning pour ne pas push le build de l'application)
        silent: true

  minify-widget:
    sources:
      - widget/widget.js
      - widget/widget.min.js
    generates:
      - widget/widget.min.js
    cmds:
      - npx rollup widget/widget.js --file widget/widget.min.js --format iife  --compact  -p @rollup/plugin-terser

  init-repo:
    cmds:
      - git remote add chatmd git@forge.apps.education.fr:chatMD/chatMD.forge.apps.education.fr.git
      - git remote add apps git@forge.apps.education.fr:eyssette/chatMD.git
      - git remote add drane git@forge.apps.education.fr:drane-lyon/chatmd.git
      - git remote add github git@github.com:eyssette/chatMD.git
      - git remote add gitlab git@gitlab.com:chatmd/chatmd.gitlab.io.git
      - git remote add frama git@framagit.org:chatmd/chatmd.frama.io.git

  push:
    vars:
      GIT_REPO_NAMES: [apps, drane, chatmd, github, gitlab, frama]
    preconditions:
      - test ! -f app/DEBUG
    cmds:
      - task: lint
      - task: tests
      - for: { var: GIT_REPO_NAMES }
        cmd: git push {{.ITEM}} && git push {{.ITEM}} --tags

  tag:
    desc: "Crée un tag avec pour date du tag la date du commit (usage: task tag -- <commit> <tag>)"
    cmds:
      - |
        bash -c '
        set -- "{{.CLI_ARGS}}"
        COMMIT=$1
        TAG=$2

        if [ -z "$COMMIT" ] || [ -z "$TAG" ]; then
          echo "❌ Usage: task tag -- <commit> <tag>"
          exit 1
        fi

        TAG_DATE=$(git show -s --format=%aD "$COMMIT")
        echo "📌 Création du tag \"$TAG\" sur le commit $COMMIT (date: $TAG_DATE)"
        GIT_COMMITTER_DATE="$TAG_DATE" git tag -a "$TAG" "$COMMIT" -m ""
        '
    silent: false

  tests:
    desc: Lance les tests unitaires et e2e, et vérifie la compatibilité ECMAScript
    cmds:
      - task: ecma
      - task: tests:unit
      # On lance la tâche tests:check-if-can-run-e2e et si il n'y a pas de code d'erreur, on lance la tâche tests:e2e.
      # Sinon, on ne lance pas les tests e2e et on retourne un code de sortie 0 pour ne pas bloquer le processus de build.
      # On demande à l'utilisateur s'il veut continuer malgré tout, et si il répond "y", on retourne un code de sortie 0 pour ne pas bloquer le processus de build, sinon on retourne un code de sortie 1 pour bloquer le processus de build.
      - cmd: |
          if task tests:check-if-can-run-e2e; then
            task tests:e2e
          else
            read -p "❌ Les tests e2e ne peuvent pas être lancés. Voulez-vous continuer malgré tout ? (y/n) " CONTINUE
            if [ "$CONTINUE" = "y" ]; then
              echo "⚠️ Vous avez choisi de continuer malgré l'impossibilité de lancer les tests e2e."
              exit 0
            else
              echo "❌ Arrêt du processus de build à cause de l'impossibilité de lancer les tests e2e."
              exit 1
            fi
          fi
        silent: true

  tests:e2e:
    desc: Lance les tests e2e avec CodeceptJS
    aliases:
      - tests:codeceptjs
    sources:
      - "{{.APP_FOLDER}}/css/**/*.css"
      - "{{.APP_FOLDER}}/js/**/*.mjs"
      - "{{.APP_FOLDER}}/js/**/*.js"
      - "{{.APP_FOLDER}}/index.html"
      - "{{.TEST_FOLDER}}/e2e/**/*.js"
      - "{{.TEST_FOLDER}}/e2e/**/*.mjs"
      - "{{.FEATURES_FOLDER}}/**/*.feature"
    cmds:
      - task: tests:check-if-can-run-e2e
      # On vérifie avant qu'il n'y ait pas le terme "@CURRENT" dans les fichiers tests e2e
      - cmd: |
          bash -c '
            set -e
            if grep -R --line-number --exclude-dir=node_modules "{{.CURRENT_E2E_TEST}}" tests/e2e features; then
              echo "❌ {{.CURRENT_E2E_TEST}} trouvé dans les tests e2e — supprimez-le avant de lancer les tests."
              exit 1
            fi
          '
        silent: true
      - task: server:start
      - defer: { task: server:stop }
      - npx codeceptjs run --steps --grep '(?=.*)^(?!.*@WIP)'

  tests:e2e:current:
    desc: Lance les tests e2e pour le test courant (utile pour le développement des tests e2e)
    cmds:
      - task: tests:check-if-can-run-e2e
      - task: server:start
      - defer: { task: server:stop }
      - npx codeceptjs run --steps --verbose --grep '(?=.*)^(?!.*@WIP)(?=.*{{.CURRENT_E2E_TEST}})'

  tests:check-if-can-run-e2e:
    desc: Vérifie si les tests e2e peuvent être lancés dans l'environnement actuel
    silent: true
    cmds:
      - cmd: |
          if ! npx playwright install; then
            echo "❌ Impossible d'installer Playwright et ses dépendances. Les tests e2e ne peuvent pas être lancés."
            exit 1
          fi
        silent: true

  tests:unit:
    aliases:
      - tests:jasmine
    sources:
      - "{{.APP_FOLDER}}/js/**/*.mjs"
      - "{{.TEST_FOLDER}}/unit/**/*.mjs"
    cmds:
      - npx jasmine --config='tests/unit/.config/jasmine.mjs'

  tests:createSteps:
    sources:
      - tests/e2e/.config/generateStepsDefinitionsFromFeatures.js
      - features/**/*.feature
      - tests/e2e/step_definitions/**/*.js
    cmds:
      - node tests/e2e/.config/generateStepsDefinitionsFromFeatures.js

  tests:widget:
    cmds:
      - node tests/test_widget.mjs

  bump:
    generates:
      - VERSION
      - package.json
      - package-lock.json
    cmds:
      - task: lint
      - task: tests
      - cz bump

  server:start:
    cmds:
      - node --env-file=.env server.js {{.PORT_LOCAL_SERVER}} & # On lance le serveur en arrière-plan
      - until nc -z localhost {{.PORT_LOCAL_SERVER}}; do sleep 1; done # On attend que le port soit ouvert avant de lancer la suite

  server:stop:
    cmds:
      - bash -c 'kill $(lsof -ti :{{.PORT_LOCAL_SERVER}}) 2>/dev/null' || true

  ecma:
    sources:
      - "{{.APP_FOLDER}}/js/**/*.mjs"
    cmds:
      - npx es-check es2018 "{{.APP_FOLDER}}/js/**/*.mjs" --module

  format:
    desc: Formate les fichiers .mjs avec Oxfmt
    cmds:
      - npx oxfmt --config .oxfmtrc.json . --ignore-path .oxfmtignore

  format:check:
    desc: Vérifie le format des fichiers avec Oxfmt
    cmds:
      - npx oxfmt --config .oxfmtrc.json --check . --ignore-path .oxfmtignore

  format:check:staged:
    desc: Vérifie le format des fichiers staged avec Oxfmt (pour le hook pre-commit)
    silent: true
    cmds:
      - |
        FILES=$(git diff --cached --name-only --diff-filter=ACM)
        if [ -z "$FILES" ]; then
          exit 0
        fi
        npx oxfmt --config .oxfmtrc.json --check $FILES --no-error-on-unmatched-pattern --ignore-path .oxfmtignore

  lint:
    desc: Lint les fichiers .mjs avec Oxlint, en affichant uniquement les erreurs (pas les warnings)
    silent: true
    cmds:
      - ERRORS_ONLY=1 npx oxlint --config oxlint.config.mjs --quiet

  lint:staged:
    desc: Lint uniquement les fichiers .mjs staged (pour le hook pre-commit)
    silent: true
    cmds:
      - |
        FILES=$(git diff --cached --name-only --diff-filter=ACM -- '{{.APP_FOLDER}}/**/*.mjs')
        if [ -z "$FILES" ]; then
          exit 0
        fi
        ERRORS_ONLY=1 npx oxlint --config oxlint.config.mjs --quiet $FILES

  lint:all:
    desc: Lint tous les fichiers .mjs avec Oxlint, en affichant toutes les erreurs, même les simples warnings
    silent: true
    cmds:
      - npx oxlint --config oxlint.config.mjs
